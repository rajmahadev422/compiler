<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Judge</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="root">

    <div id="right-panel">

      <div id="toolbar"
        class="h-13 border-b border-zinc-800 bg-[#0d0d1a] flex items-center justify-between px-4 shrink-0 select-none">
        <h1 class="text-2xl text-green-400">Compiler</h1>
        <div class="flex items-center gap-2.5">
          <select id="lang-select"
            class="bg-[#0d0d1a] text-zinc-200 border border-zinc-700 px-3 py-1 rounded-lg font-['JetBrains_Mono',monospace] text-xs outline-hidden cursor-pointer focus:border-cyan-500/50 transition-colors">
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="javascript">Javascript</option>
          </select>
        </div>
        <div class="flex items-center gap-2.5">
          <button id="btn-run"
            class="bg-zinc-800 text-zinc-200 border border-zinc-700 px-4 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors hover:bg-zinc-700">
            ▷ Run
          </button>
        </div>
      </div>

      <div id="editor-section">
        <div id="editor"></div>
      </div>

      <div id="v-divider"></div>

      <div id="io-section" class="bg-[#06060c]">
        <div class="io-pane">
          <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-2.5 select-none">Custom Input
          </div>
          <textarea
            class="flex-1 bg-[#0d0d1a] border border-zinc-800 rounded-xl p-3 font-['JetBrains_Mono',monospace] text-xs text-zinc-400 outline-hidden resize-none overflow-y-auto select-text focus:border-zinc-700 transition-colors"
            id="custom-input" placeholder="2 7 11 15&#10;9"></textarea>
        </div>
        <div class="io-pane">
          <div
            class="text-[11px] flex justify-between font-bold text-zinc-500 uppercase tracking-widest mb-2.5 select-none">
            <p>Expected Output </p><span class="test" id="testRes"></span>
          </div>
          <textarea
            class="flex-1 bg-[#0d0d1a] border border-zinc-800 rounded-xl p-3 font-['JetBrains_Mono',monospace] text-xs text-zinc-400 outline-hidden resize-none overflow-y-auto select-text focus:border-zinc-700 transition-colors"
            id="expected-output" placeholder="2 7 11 15&#10;9"></textarea>
        </div>
        <div class="io-pane">
          <div class="text-[11px] font-bold text-zinc-500 tracking-widest mb-2.5 select-none">OUTPUT</div>
          <div
            class="flex-1 bg-[#0d0d1a] border border-zinc-800 rounded-xl px-2 font-['JetBrains_Mono',monospace] text-xs text-green-400 outline-hidden overflow-y-auto whitespace-pre select-text">
            <p id="output-box">Waiting for execution…</p>
            <span id="finish"></span>
          </div>
        </div>
      </div>

    </div>

    <div id="advertisement"
      class="min-h-screen py-4 flex-1 min-w-0 hidden md:block bg-gradient-to-br from-[#0d0d1a] via-[#1a1a2e] to-[#0d0d1a] border-t border-zinc-800 flex flex-col items-center overflow-y-auto justify-center px-4">
      </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script>
    const socket = io();

    socket.on('connect', () => {
      console.log('Connected: ', socket.id);
    });

    const outputBox = document.getElementById('output-box');
    const testRes = document.getElementById('testRes');
    const runBtn = document.getElementById('btn-run');

    socket.on('status', (output) => {
      outputBox.textContent = output;

      testRes.innerText = "pending";
      setRunning(true);
      testRes.classList.remove('test-success', 'test-failed');
      testRes.classList.add('test-pending');
    });

    const expRes = document.getElementById('expected-output');

    socket.on('finished', (finished) => {
      document.getElementById('finish').innerText = finished;
      setRunning(false);
      const expected = normalizeOutput(expRes.value);
      const actual = normalizeOutput(outputBox.textContent);

      if (expected === actual) {
        testRes.innerText = "true";
        testRes.classList.remove('test-pending', 'test-failed');
        testRes.classList.add('test-success');
      } else {
        testRes.innerText = "false";
        testRes.classList.remove('test-pending', 'test-success');
        testRes.classList.add('test-failed');
      }
    });
    function normalizeOutput(str) {
      return str
        .trim()
        .split(/\s+/)
        .join(' ');
    }
    function setRunning(running) {
      runBtn.disabled = running;

      if (running) {
        runBtn.classList.add('opacity-50', 'cursor-not-allowed');
        runBtn.classList.remove('cursor-pointer');
      } else {
        runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        runBtn.classList.add('cursor-pointer');
      }
    }
  </script>
  <script src="./js/data.js"></script>
  <script src="./js/index.js"></script>
  <script src="./js/draggable.js"></script>

</body>

</html>
